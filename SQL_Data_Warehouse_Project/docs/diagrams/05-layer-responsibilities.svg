<text x="556" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">ROLE: clean and standardize</text>
<text x="556" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Latest customer per source ID</text>
<text x="556" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Normalize keys, codes, and countries</text>
<text x="556" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Handle dates and sales amounts</text>
<text x="556" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Derive product end dates</text>
<text x="556" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155"></text>
<text x="556" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">AUDIENCE: developer / analyst</text>
<text x="556" y="473" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">METADATA: dwh_create_date</text>
