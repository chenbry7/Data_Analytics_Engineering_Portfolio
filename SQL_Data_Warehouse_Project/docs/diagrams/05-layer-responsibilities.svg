<text x="66" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">OBJECTS: six typed tables</text>
<text x="66" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">METHOD: TRUNCATE + BULK INSERT</text>
<text x="66" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155"></text>
<text x="66" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">ROLE: isolate ingestion</text>
<text x="66" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Source-aligned fields</text>
<text x="66" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">No intentional business cleansing</text>
<text x="66" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">Type conversion can reject input</text>
<text x="66" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155"></text>
<text x="66" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">AUDIENCE: warehouse developer</text>
<text x="66" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">LIMIT: previous loads overwritten</text>
