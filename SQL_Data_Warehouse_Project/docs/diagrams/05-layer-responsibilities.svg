<text x="1046" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155"></text>
<text x="1046" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">AUDIENCE: analyst / reporting</text>
