<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img" aria-labelledby="title desc">
<title id="title">Layer Responsibilities</title><desc id="desc">Medallion organization implemented on relational SQL Server tables and views.</desc>
