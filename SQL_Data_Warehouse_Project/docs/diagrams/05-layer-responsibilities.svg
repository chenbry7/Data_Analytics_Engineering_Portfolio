<text x="556" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">OBJECTS: six tables</text>
<text x="556" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">METHOD: TRUNCATE + INSERT SELECT</text>
